<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex - Grupo 02 Pierre Plantarrosa</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <h1>Pokedex Virtual</h1>
    </header>

    <nav class="navbar">
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#pokedex">Ver Pokemones</a></li>
            <li><a href="#acerca">Acerca de</a></li>
        </ul>
    </nav>

    <main>
        <section id="inicio" class="hero-section">
            <h2>Encuentra a tu Pokemon favorito</h2>
            <p>Explora nuestro catalogo de pokemons. Proximamente con la PokeAPI conectada</p>
        </section>

        <section id="pokedex" class="pokedex-grid">

            <article class="pokemon-card">
                <img
                    src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png">
                <h3>#001 Bulbasaur</h3>
                <p class="type">Planta / Veneno</p>
            </article>

            <article class="pokemon-card">
                <img
                    src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/004.png">
                <h3>#004 Charmander</h3>
                <p class="type">Fuego</p>
            </article>

            <article class="pokemon-card">
                <img
                    src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/007.png">
                <h3>#007 Squirtle</h3>
                <p class="type">Agua</p>
            </article>

        </section>
    </main>

    <footer>
        <p>Programacion Web I - INF 240 | Grupo 02</p>
    </footer>

</body>
</html>
